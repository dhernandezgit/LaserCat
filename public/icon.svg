<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b17a"/>
      <stop offset=".52" stop-color="#c39358"/>
      <stop offset="1" stop-color="#a9743f"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7b27c"/>
      <stop offset="1" stop-color="#b9874d"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".42" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d2613" stop-opacity=".45"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <clipPath id="square"><rect width="512" height="512" rx="86"/></clipPath>
  </defs>
  <g clip-path="url(#square)">
    <rect width="512" height="512" fill="url(#kraft)"/>
    <!-- vetas de madera -->
    <g stroke="#8d5c2d" stroke-opacity=".2" fill="none">
      <path d="M-20 84 C 110 66, 250 104, 540 74" stroke-width="4"/>
      <path d="M-20 118 C 150 96, 300 138, 540 108" stroke-width="2"/>
      <path d="M-20 402 C 130 376, 320 420, 540 386" stroke-width="5"/>
      <path d="M-20 438 C 160 414, 340 452, 540 424" stroke-width="2"/>
    </g>
    <!-- caja de cartón -->
    <path d="M52 348 L256 300 L460 348 L460 470 L256 512 L52 470 Z" fill="url(#box)"/>
    <path d="M52 348 L256 300 L460 348 L256 392 Z" fill="#c89a61"/>
    <path d="M256 392 L460 348 L460 470 L256 512 Z" fill="#a8753f" opacity=".55"/>
    <path d="M256 392 L52 348 L52 470 L256 512 Z" fill="#c4955b" opacity=".35"/>
    <path d="M52 348 L256 300 L460 348" fill="none" stroke="#7d5126" stroke-opacity=".5" stroke-width="4"/>
    <!-- gato negro -->
    <g>
      <path d="M150 336 C 138 286, 150 238, 186 205 L 178 128 L 232 168 C 247 162, 265 162, 280 168 L 334 128 L 326 205 C 362 238, 374 286, 362 336 C 348 382, 300 400, 256 400 C 212 400, 164 382, 150 336 Z" fill="#171412"/>
      <path d="M186 205 L 197 160 L 224 186 Z" fill="#3d2b2b" opacity=".55"/>
      <path d="M326 205 L 315 160 L 288 186 Z" fill="#3d2b2b" opacity=".55"/>
      <!-- ojos láser -->
      <g filter="url(#glow)">
        <ellipse cx="216" cy="256" rx="20" ry="13" fill="#ff2d1a"/>
        <ellipse cx="296" cy="256" rx="20" ry="13" fill="#ff2d1a"/>
        <ellipse cx="216" cy="256" rx="7" ry="11" fill="#fff3e0"/>
        <ellipse cx="296" cy="256" rx="7" ry="11" fill="#fff3e0"/>
      </g>
      <path d="M204 286 L 232 294 M308 286 L 280 294" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <path d="M246 300 Q 256 308 266 300" stroke="#c8a48c" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- bigotes -->
      <g stroke="#d9bfa6" stroke-width="4" stroke-linecap="round" opacity=".85">
        <path d="M198 300 L 146 288 M198 312 L 144 314 M314 300 L 366 288 M314 312 L 368 314"/>
      </g>
      <!-- reflejo de rayos -->
      <g stroke="#ff3b24" stroke-linecap="round" opacity=".9" filter="url(#soft)">
        <path d="M196 252 L -12 226" stroke-width="7"/>
        <path d="M316 258 L 524 232" stroke-width="7"/>
      </g>
    </g>
    <!-- marcador de esquina, guiño a las marcas de corte -->
    <path d="M34 86 L34 34 L86 34" fill="none" stroke="#f4e3c3" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <path d="M426 478 L478 478 L478 426" fill="none" stroke="#f4e3c3" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect width="512" height="512" rx="86" fill="url(#vignette)"/>
  <rect x="3" y="3" width="506" height="506" rx="84" fill="none" stroke="#4b2f16" stroke-opacity=".35" stroke-width="6"/>
</svg>
